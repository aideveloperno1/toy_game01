name: Deploy to Azure
on:
  workflow_dispatch:
    inputs:
      first_deploy:
        description: First deployment to an empty App Service
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package production dependencies
        run: |
          mkdir package
          cp -r dist dist-server package.json package-lock.json package/
          cd package
          npm ci --omit=dev
          zip -qr ../release.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: azure-release
          path: release.zip
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Wait for current rounds
        if: ${{ !inputs.first_deploy }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          ADMIN_TOKEN: ${{ secrets.GAME_ADMIN_TOKEN }}
        run: node scripts/drain.mjs
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release.zip
      - name: Verify health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 5 "$APP_URL/health"
      - name: Resume rounds after a failed deployment
        if: ${{ failure() && !inputs.first_deploy }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          ADMIN_TOKEN: ${{ secrets.GAME_ADMIN_TOKEN }}
        run: node scripts/drain.mjs --resume
