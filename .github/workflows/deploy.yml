name: Test and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm ci --prefix api --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: swa-package
          retention-days: 7
          include-hidden-files: true
          path: |
            dist
            api/dist
            api/host.json
            api/package.json
            api/package-lock.json
            api/node_modules
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: azure-static-web-apps-production
      cancel-in-progress: false
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Deployment configuration
        if: env.SWA_TOKEN == ''
        run: echo '::notice::Set AZURE_STATIC_WEB_APPS_API_TOKEN to enable automatic SWA deployment.'
      - uses: actions/checkout@v4
        if: env.SWA_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.SWA_TOKEN != ''
        with:
          name: swa-package
      - uses: Azure/static-web-apps-deploy@v1
        if: env.SWA_TOKEN != ''
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          production_branch: main
          app_location: dist
          api_location: api
          output_location: ""
          skip_app_build: true
          skip_api_build: true
